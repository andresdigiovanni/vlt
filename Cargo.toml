[package]
name = "vlt"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Semantic search over an Obsidian vault, for AI agents (MCP) and humans (CLI)"
repository = "https://github.com/andresdigiovanni/vlt"
readme = "README.md"

[[bin]]
name = "vlt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sqlite-vec = "=0.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml_edit = { version = "0.25", features = ["serde"] }
thiserror = "2"
rmcp = { version = "3.5", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "time", "sync"] }
schemars = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.22"
ureq = { version = "3", features = ["platform-verifier"] }
sha1 = "0.10"
sha2 = "0.10"
walkdir = "2"
globset = "0.4"
fs4 = "1"
inquire = "0.9"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "real_models"
harness = false

[[bench]]
name = "eval"
harness = false
